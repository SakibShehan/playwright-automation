[pytest]
testpaths = tests
pythonpath = .
addopts =
    --browser=chromium
    --screenshot=on
    --video=on
    --tracing=on
    --output=test-results
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
    --clean-alluredir
log_cli = true
log_cli_level = INFO
markers =
    smoke: fast pre-deploy checks
    regression: full test suite
    mobile: mobile device emulation tests